name: engineering-lab-022
services:
  builder:
    image: golang:1.25.4-bookworm@sha256:e17419604b6d1f9bc245694425f0ec9b1b53685c80850900a376fb10cb0f70cb
    working_dir: /lab
    volumes: [.:/lab]
    entrypoint: [sh, -c, 'go version && df --version && go vet ./src && go build -o .work/lab022-linux ./src']
    cpus: 2.0
    mem_limit: 512m
    network_mode: none
  runner:
    image: golang:1.25.4-bookworm@sha256:e17419604b6d1f9bc245694425f0ec9b1b53685c80850900a376fb10cb0f70cb
    working_dir: /lab
    volumes: [.:/lab]
    entrypoint: [/lab/.work/lab022-linux]
    tmpfs: [/scratch:rw,size=1m,nr_inodes=32,mode=0700,noswap]
    cpus: 1.0
    mem_limit: 128m
    network_mode: none
