name: engineering-lab-016
services:
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 32mb, --maxmemory-policy, noeviction]
    ports:
      - '127.0.0.1::6379'
    cpus: 1.0
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [isolated]
  mysql:
    image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    environment:
      MYSQL_ROOT_PASSWORD: lab-only-password
    command: [--skip-log-bin, --innodb-buffer-pool-size=128M, --performance-schema=ON]
    cpus: 2.0
    mem_limit: 1g
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h127.0.0.1 -uroot -N -e "SELECT 1"']
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [isolated]
volumes:
  db-data:
networks:
  isolated:
    internal: true
