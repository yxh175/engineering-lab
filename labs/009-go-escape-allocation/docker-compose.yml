name: engineering-lab-009
services:
  builder:
    image: golang:1.25.4-bookworm@sha256:e17419604b6d1f9bc245694425f0ec9b1b53685c80850900a376fb10cb0f70cb
    working_dir: /lab
    environment:
      CGO_ENABLED: "0"
      GOMAXPROCS: "1"
      GOGC: "100"
      GOMEMLIMIT: "off"
      GOCACHE: /tmp/go-cache
    command: [sleep, infinity]
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - .:/lab:ro
      - ./.work/linux:/out
