name: engineering-lab-003
services:
  runner:
    image: golang:1.25.4-bookworm@sha256:e17419604b6d1f9bc245694425f0ec9b1b53685c80850900a376fb10cb0f70cb
    working_dir: /lab
    volumes:
      - .:/lab
    environment:
      GORACE: exitcode=66 halt_on_error=0 atexit_sleep_ms=0
    cpus: 2.0
    mem_limit: 1g
    network_mode: none
