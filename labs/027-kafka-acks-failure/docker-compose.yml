      "image": "apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed",
      "container_name": "lab027-controller",
      "hostname": "controller",
      "environment": {
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,HOST:PLAINTEXT",
        "KAFKA_CONTROLLER_LISTENER_NAMES": "CONTROLLER",
        "KAFKA_CONTROLLER_QUORUM_VOTERS": "100@controller:9093",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "BROKER",
        "CLUSTER_ID": "4L6g3nShT-eMCtK--X86sw",
        "KAFKA_LOG_DIRS": "/tmp/kraft-combined-logs",
        "KAFKA_HEAP_OPTS": "-Xms128m -Xmx256m",
        "KAFKA_NODE_ID": 100,
        "KAFKA_PROCESS_ROLES": "controller",
        "KAFKA_LISTENERS": "CONTROLLER://:9093"
      },
      "mem_limit": "512m",
      "cpus": 1.0,
      "healthcheck": {
        "test": [
          "CMD",
          "/bin/bash",
          "-c",
          "echo > /dev/tcp/localhost/9093"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30,
        "start_period": "10s"
      }
    },
