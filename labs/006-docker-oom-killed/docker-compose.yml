name: engineering-lab-006
services:
  builder:
    image: golang:1.25.4-bookworm@sha256:e17419604b6d1f9bc245694425f0ec9b1b53685c80850900a376fb10cb0f70cb
    working_dir: /lab
    volumes:
      - .:/lab
    cpus: 2.0
    mem_limit: 512m
    network_mode: none
  runner:
    image: golang:1.25.4-bookworm@sha256:e17419604b6d1f9bc245694425f0ec9b1b53685c80850900a376fb10cb0f70cb
    working_dir: /lab
    volumes:
      - .:/lab:ro
    entrypoint: [/lab/.work/lab006-linux]
    cpus: 2.0
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      GOGC: '100'
      GOMEMLIMIT: 'off'
    network_mode: none
